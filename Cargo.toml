[package]
name = "ac_rust"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# 202411から:
rpds = "=1.1.1"
rand_xorshift = "=0.4.0"
rand_xoshiro = "=0.7.0"
primal = "=0.3.3"
thiserror = "=2.0.16"

# 202301から:
ac-library-rs = "=0.2.0"
once_cell = "=1.21.3"
memoise = "=0.3.2"
btreemultimap = "=0.1.1"
bstr = "=1.12.0"

# 202004から続投:
num-bigint = "=0.4.6"
num-complex = "=0.4.6"
num-integer = "=0.1.46"
num-traits = "=0.2.19"

libm = "=0.2.15"

rand = "=0.9.2"
rand_chacha = "=0.9.0"
rand_distr = "=0.5.1"

proconio = { version = "=0.5.0", features = ["derive"] }

indexmap = "=2.11.0"
regex = "=1.11.2"
superslice = "=1.0.0"
itertools = "=0.14.0"
maplit = "=1.0.2"
either = "=1.15.0"
im-rc = "=15.1.0"

rustc-hash = "=2.1.1"
smallvec = { version = "=1.15.1", features = ["const_generics", "const_new", "write", "union", "serde", "arbitrary"] }

[lib]
name = 'cpio'
path = './src/cpio.rs'
