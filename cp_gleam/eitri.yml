version: 1.0

author: Ayush Biswas

editor: "code {{ .Filename }}"

# How to generate the destination filename.
filename:
  rules:
    - site: codeforces.com
      regex: "(?:problemset/problem|contest)/(\\d+)(?:/problem)?/([A-Za-z0-9]+)"
      template: './src/bin/{{ index .Captures 1 }}_{{ index .Captures 2 | toLowerCase }}.gleam'

    - site: atcoder.jp
      regex: "contests/([^/]+)/tasks/([^_]+)_([a-z]+)"
      template: './src/bin/{{ index .Captures 1 }}_{{ index .Captures 3 | toLowerCase }}.gleam'

    - site: cses.fi
      regex: "problemset/task/(\\d+)/?$"
      template: './src/bin/cses_{{ index .Captures 1 }}_{{ .Title | toSnakeCase }}.rs'

# Base source template.
template:
  source: ./src/main.gleam
  modifier: |
    // Created by {{ .Author }} at {{ .Time }} 
    // {{ .Url }} 
    {{ .Code }}

# Optional code post-processing.
code:
  modifier: |
    {{ .Header }}

    {{ .Code }}
    
    {{ range .LibFiles }}
    {{ .Content }}
    {{end}}

# Library injection.
lib:
  regex: "import\\s*lib/{{.Name}}"
  include:
    _: "./src/lib/"

# Compilation.
compiler:
  name: Gleam
  source: main.gleam
  compile: gbuild # empty if no compilation to be performed
  args:
  run: "gleam run --no-print-progress -m main"

# Behaviour
create_file: true
run_on_save: true
